<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6e56">
<title>แบบสำรวจผลิตภัณฑ์ลดใช้พลังงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#e1e6ef;--pri:#0f6e56;--pri2:#e3f2ec;--warn:#b54708;--warnbg:#fff4e5;--err:#b42318;--errbg:#fee4e2;--okbg:#e3f6ea;--ok:#127a3a;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun','Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button{font-family:inherit}
header#top{position:sticky;top:0;z-index:30;background:var(--pri);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header#top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#saved{font-size:12px;opacity:.85}
.hbtn{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
main{max-width:880px;margin:0 auto;padding:12px 12px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.sec{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-weight:700;font-size:16px;flex-wrap:wrap}
.sec .n{background:var(--pri);color:#fff;border-radius:8px;padding:1px 8px;font-size:13px}
.sub{font-size:13px;color:var(--mute);margin:-4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:8px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);min-width:0}
.fld.full{grid-column:1/-1}.fld.w2{grid-column:span 2}
.ib{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fbfcfe;overflow:hidden}
.ib:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}
.ib input,.ib select,.ib textarea{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:10px;font:inherit;font-size:16px;color:var(--ink);outline:none}
.ib textarea{min-height:70px;resize:vertical}
.ib em{font-style:normal;font-size:12px;color:var(--mute);padding:0 10px 0 2px;white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{cursor:pointer}.seg input{display:none}
.seg b{display:inline-block;font-weight:600;font-size:14px;color:var(--ink);padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff}
.seg input:checked+b{background:var(--pri);border-color:var(--pri);color:#fff}
.radio{margin-bottom:10px}
.cbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;margin-bottom:8px}
.cb{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:15px}
.cb input{width:20px;height:20px;accent-color:var(--pri);flex:none}
.cb:has(input:checked){background:var(--pri2);border-color:#9fd3c0}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 13px;font-size:14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.danger{color:var(--err);border-color:#f3c3be}
.btn.big{padding:13px 16px;font-size:16px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tip{font-size:13px;color:var(--mute);background:#f7f9fc;border-radius:10px;padding:8px 10px;margin:0 0 10px}
.calcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:6px 0}
.calc{background:var(--pri2);border-radius:10px;padding:8px 10px;font-size:13px;color:#245c4b;display:flex;flex-direction:column}
.calc b{font-size:18px;color:var(--pri)}
.calc.sm b{font-size:16px}
.tbl .row{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fcfdfe}
.rh{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.rh i{font-style:normal;background:#eef1f6;border-radius:6px;padding:1px 7px;font-size:12px;color:var(--mute)}
.rh b{font-size:15px}
.rh input{flex:1;min-width:120px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:15px;background:#fff}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;position:sticky;top:52px;z-index:10;background:var(--bg)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.chip i{font-style:normal;color:var(--mute);margin-right:4px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}.chip.on i{color:#cfe9df}
.stephead{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.stephead .big{width:52px;height:52px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.stephead small{color:var(--mute)}.stephead h2{margin:0;font-size:20px}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#bnav[hidden]{display:none}
#bnav button{flex:1}#bnav span{font-size:12px;color:var(--mute);text-align:center;min-width:56px}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.err{background:var(--errbg);color:var(--err)}
.hero{background:linear-gradient(135deg,#0f6e56,#14866a);color:#fff;border:0}
.hero b{font-size:19px;display:block}.hero span{font-size:14px;opacity:.9}
.hero .btn{border-color:transparent}
.shop .sh-top{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:12px;background:#fff3dc;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.sh-i{display:flex;flex-direction:column;min-width:0}.sh-i b{font-size:17px}.sh-i span{font-size:13px;color:var(--mute)}
.prog{height:8px;background:#edf0f5;border-radius:99px;overflow:hidden;margin:12px 0 6px}.prog i{display:block;height:100%;background:var(--pri)}
.sh-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin-bottom:6px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.warnbox{border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.warnbox.warn{background:var(--warnbg);color:#7a3306}.warnbox.err{background:var(--errbg);color:#7a1a12}.warnbox.info{background:#eef4ff;color:#1e3a8a}
.warnbox button{margin-left:auto;flex:none}
.lay{position:relative;width:100%;aspect-ratio:1120/520;border:2px dashed #b8c2d3;border-radius:10px;background:#fbfcfe;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}
.li{position:absolute;border:2px solid #2a4ea8;background:rgba(42,78,168,.06);display:flex;align-items:center;justify-content:center;text-align:center;color:#1a3a9c;font-weight:600;font-size:13px;padding:4px;cursor:move;line-height:1.25}
.li.circle{border-radius:50%}
.li.sel{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2);background:rgba(15,110,86,.08)}
.li .rz{position:absolute;right:-7px;bottom:-7px;width:18px;height:18px;border-radius:50%;background:var(--pri);border:2px solid #fff;display:none;cursor:nwse-resize}
.li.sel .rz{display:block}
.selbox{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph-it{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.ph-it img{width:100%;height:110px;object-fit:cover;display:block}
.ph-it input{width:100%;border:0;border-top:1px solid var(--line);padding:7px;font:inherit;font-size:13px}
.ph-it button{position:absolute;top:5px;right:5px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer}
.ph-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:140px;border:2px dashed #b8c2d3;border-radius:10px;color:var(--pri);font-size:26px;cursor:pointer;background:#fbfcfe}
.ph-add span{font-size:13px;font-weight:600}
.std-row{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.std-h{display:flex;align-items:center;gap:10px}
.bdg-s{width:46px;height:46px;border-radius:50%;border:2px solid #333;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;text-align:center;line-height:1.1}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi span{font-size:12px;color:var(--mute);display:block}.kpi b{font-size:22px;color:var(--pri)}.kpi small{color:var(--mute)}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.stbanner{background:var(--errbg);color:#7a1a12;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}

/* ---------- PRINT ---------- */
#printRoot{display:none;background:#5b6270;min-height:100vh}
body.preview header#top,body.preview #app,body.preview #bnav{display:none}
body.preview #printRoot{display:block}
.pvbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;padding:10px;background:#2b2f38;align-items:center;flex-wrap:wrap}
.pvbar span{color:#cfd5e1;font-size:13px;flex:1;min-width:120px}
.pages{padding:10px 0}
.pg{width:210mm;height:296mm;padding:9mm 13mm 8mm;background:#fff;color:#000;position:relative;overflow:hidden;margin:0 auto 12px;box-shadow:0 2px 12px rgba(0,0,0,.35);font-family:'Sarabun','TH Sarabun New',Tahoma,sans-serif;font-size:10.5pt;line-height:1.38;display:flex;flex-direction:column}
.pg.land{width:296mm;height:209mm;page:land}
.pb{flex:1;min-height:0;overflow:hidden}
.pb>.fit{transform-origin:top left;display:flow-root}
.t1{font-size:9.6pt}.t1 td{padding:.7mm 1.5mm!important}
.inst{font-size:9.6pt;line-height:1.3}
@page{size:A4 portrait;margin:0}
@page land{size:A4 landscape;margin:0}
@media print{
 html,body{background:#fff!important}
 header#top,#app,#bnav,.pvbar,#toast{display:none!important}
 #printRoot{display:block!important;background:#fff;min-height:0}
 .pages{padding:0}
 .pg{margin:0!important;box-shadow:none!important;zoom:1!important;break-after:page;page-break-after:always}
 .pg:last-child{break-after:auto;page-break-after:auto}
}
.ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px dashed #444;padding-bottom:2mm;margin-bottom:2.5mm;gap:6mm}
.phl{display:flex;align-items:center;gap:2.5mm;line-height:1.1}
.phl img{height:12mm;width:auto}
.phl b{font-size:10pt;display:block}.phl big{font-size:15pt;font-weight:600;display:block;letter-spacing:.3px}
.phr{text-align:right;font-size:8pt;line-height:1.3}.phr b{font-size:10.5pt}
.pf{display:flex;justify-content:space-between;border-top:1px dashed #444;padding-top:1.5mm;font-size:9pt;margin-top:2mm}
.val{color:#1a3a9c;font-weight:600}
.ck{display:inline-block;width:3.6mm;height:3.6mm;border:1px solid #000;vertical-align:-.6mm;margin-right:1.5mm;text-align:center;line-height:3.2mm;font-size:9pt;color:#1a3a9c;font-weight:700}
table.ft{width:100%;border-collapse:collapse;margin-bottom:2.5mm}
table.ft td,table.ft th{border:1px solid #000;padding:1.2mm 1.8mm;vertical-align:middle}
table.ft th{background:#d0d0d0;font-weight:700;text-align:center;line-height:1.2}
table.ft.sm{font-size:9pt}table.ft.sm td,table.ft.sm th{padding:.6mm 1.2mm}
table.ft td.c,.c{text-align:center}
td.top{vertical-align:top!important;text-align:center}
.st{font-weight:700;margin:1.5mm 0 1.5mm}
.bl{margin:0 0 1.5mm 6mm}
.dl{display:inline-block;min-width:22mm;border-bottom:1px dotted #000;text-align:center;padding:0 1mm}
.p1top{display:flex;border:1px solid #000;margin-bottom:2mm}
.ttl{flex:1;background:#d9d9d9;text-align:center;font-size:15pt;padding:3mm;border-right:1px solid #000}
.ttlb{font-size:23pt;font-weight:700}
.dbox{width:44mm;text-align:center;font-size:10pt;display:flex;flex-direction:column}
.dbox .dl1{padding:1.5mm;flex:1}
.d3{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid #000}
.d3 span{border-left:1px solid #000;padding:1mm;min-height:6mm}.d3 span:first-child{border-left:0}
.inst ol{margin:1mm 0 1mm;padding-left:6mm}
.parts{padding-left:4mm}
hr.sep{border:0;border-top:1.5px solid #000;margin:2mm 0}
.cg2{display:grid;grid-template-columns:1fr 1fr;gap:.5mm 4mm}
.laybox{position:relative;height:88mm;border:1px solid #000;margin-bottom:2mm}
.laybox .li{font-size:10pt;cursor:default;background:none}
.bdg{display:inline-flex;width:13mm;height:13mm;border:1.5px solid #000;border-radius:50%;align-items:center;justify-content:center;font-weight:700;font-size:7.5pt;text-align:center;line-height:1.05}
.flowbox{border:1px solid #000;height:150mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2mm;margin:2mm 0 3mm}
.fb{background:#d0d0d0;text-align:center;padding:2.5mm 6mm;min-width:105mm;font-size:10.5pt}
.fb.head{font-weight:700;font-size:12pt;min-width:72mm;padding:4mm 6mm}
.frow{display:flex;align-items:center;gap:4mm}
.frow .ck{width:6mm;height:6mm;line-height:5.5mm;font-size:13pt;border-width:1.5px}
.arr{width:0;height:0;border-left:3mm solid transparent;border-right:3mm solid transparent;border-top:4mm solid #222;position:relative;margin-top:3mm}
.arr:before{content:'';position:absolute;left:-1mm;top:-7mm;width:2mm;height:3.2mm;background:#222}
.fnote{max-width:150mm;text-align:center;margin-top:2mm}
.sig{width:95mm;margin-left:auto;line-height:2}
.cert{padding:16mm 20mm}
.certlogos{display:flex;justify-content:center;align-items:center;gap:12mm;margin-bottom:6mm}
.certlogos img{height:16mm}
.certlogos .t{font-size:10pt;line-height:1.15}.certlogos .t big{font-size:14pt;display:block}
.cert h2{text-align:center;font-size:17pt;margin:2mm 0}
.cert .lines p{margin:0 0 5mm;font-size:12pt;display:flex;gap:2mm;align-items:flex-end}
.cert .lines .dl{flex:1;text-align:left}
.cert .thick{border-top:2.5px solid #000;margin:5mm 0 8mm}
.pgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:4mm;flex:1;min-height:0}
.pgrid figure{margin:0;display:flex;flex-direction:column;min-height:0}
.pim{flex:1;min-height:0;border:1px solid #999;display:flex;align-items:center;justify-content:center;background:#fafafa;overflow:hidden}
.pim img{max-width:100%;max-height:100%;object-fit:contain}
.pgrid figcaption{font-size:9.5pt;padding-top:1mm}
.phd{display:flex;justify-content:space-between;border-bottom:1px dashed #444;padding-bottom:2mm;margin-bottom:3mm}
</style>
</head>
<body>
<header id="top"><h1 id="ttl">แบบสำรวจผลิตภัณฑ์ลดใช้พลังงาน</h1><span id="saved"></span><span id="hb"></span></header>
<main id="app"></main>
<div id="bnav" hidden><button class="btn" id="bprev">◀ ก่อนหน้า</button><span id="bmid"></span><button class="btn pri" id="bnext">ถัดไป ▶</button></div>
<div id="printRoot"></div>
<div id="toast"></div>
<script>
'use strict';
/* ========== utils ========== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const num=x=>{const n=parseFloat(String(x??'').replace(/,/g,''));return isFinite(n)?n:0};
const has=x=>x!==undefined&&x!==null&&x!==false&&String(x).trim()!=='';
const sum=a=>a.reduce((s,x)=>s+(+x||0),0);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
function fmt(n,dp=2){if(n===null||n===undefined||typeof n!=='number'||!isFinite(n))return '-';if(n===0)return '0';return Number(n.toFixed(dp)).toLocaleString('th-TH',{maximumFractionDigits:dp})}
function getP(o,p){return p.split('.').reduce((a,k)=>a==null?undefined:a[k],o)}
function setP(o,p,val){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){const k=ks[i];if(a[k]==null)a[k]=/^\d+$/.test(ks[i+1])?[]:{};a=a[k]}a[ks[ks.length-1]]=val}
const TM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thDate3(iso){if(!has(iso))return['','',''];const [y,m,d]=iso.split('-').map(Number);if(!y)return['','',''];return[String(d),TM[m-1]||'',String((y+543)%100).padStart(2,'0')]}
function thDate(iso){const a=thDate3(iso);return a[0]?a.join(' '):''}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}

/* ========== storage ========== */
const DB={db:null,mode:'idb',mem:{shops:{},kv:{}},
 async init(){
  try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('tongmuan-survey',1);r.onupgradeneeded=()=>{const db=r.result;db.createObjectStore('shops',{keyPath:'id'});db.createObjectStore('kv')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});this.mode='idb'}
  catch(e){try{localStorage.setItem('_t','1');localStorage.removeItem('_t');this.mode='ls';const s=JSON.parse(localStorage.getItem('tm_db')||'null');if(s)this.mem=s}catch(e2){this.mode='mem'}}
 },
 tx(st,m,fn){return new Promise((res,rej)=>{const t=this.db.transaction(st,m);const r=fn(t.objectStore(st));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
 lsSave(){if(this.mode==='ls'){try{localStorage.setItem('tm_db',JSON.stringify(this.mem))}catch(e){toast('⚠️ พื้นที่เก็บเต็ม — กรุณาสำรองไฟล์ JSON')}}},
 async all(){if(this.mode==='idb')return this.tx('shops','readonly',s=>s.getAll());return Object.values(this.mem.shops)},
 async put(o){if(this.mode==='idb')return this.tx('shops','readwrite',s=>s.put(o));this.mem.shops[o.id]=o;this.lsSave()},
 async del(id){if(this.mode==='idb')return this.tx('shops','readwrite',s=>s.delete(id));delete this.mem.shops[id];this.lsSave()},
 async get(k){if(this.mode==='idb')return this.tx('kv','readonly',s=>s.get(k));return this.mem.kv[k]},
 async set(k,v){if(this.mode==='idb')return this.tx('kv','readwrite',s=>s.put(v,k));this.mem.kv[k]=v;this.lsSave()}
};

 let kwh=0,lpgB=0,bioB=0;c.trayArea=0;c.wb=0;c.wa=0;c.dryArea=0;
 BLOCKS(d).forEach(b=>{const rows=t[b.id]||[];
  if(b.type==='musage'){const h=hrs(f[b.fp+'dur'],f[b.fp+'du']);c[b.id]={h,kwh:num(f[b.fp+'kw'])*h};kwh+=c[b.id].kwh}
  else if(b.type==='susage'){c[b.id]=rows.map(r=>{const h=hrs(r.dur,r.du);return{h,kwh:num(r.kw)*h}});kwh+=sum(c[b.id].map(x=>x.kwh));lpgB+=sum(rows.map(r=>num(r.lpg)));bioB+=sum(rows.map(r=>num(r.bkg)))}
  else if(b.type==='pack'){c[b.id]=rows.map(r=>({kwh:num(r.kw)*num(r.h)}));kwh+=sum(c[b.id].map(x=>x.kwh))}
  else if(b.type==='tray'){c[b.id]=rows.map(r=>{const a=num(r.w)*num(r.l);return{area:a,tarea:a*num(r.cnt)}});c.trayArea+=sum(c[b.id].map(x=>x.tarea))}
  else if(b.type==='dusage'){c[b.id]=rows.map(r=>({kwh:num(r.kw)*num(r.hd)*(num(r.days)||1)}));kwh+=sum(c[b.id].map(x=>x.kwh));c.wb+=sum(rows.map(r=>num(r.wb)));c.wa+=sum(rows.map(r=>num(r.wa)));c.dryArea=Math.max(c.dryArea,...rows.map(r=>num(r.area)));const heat=sum(rows.map(r=>num(r.heat)));if(f.heatType==='LPG')lpgB+=heat;if(f.heatType==='ชีวมวล')bioB+=heat}
 });

 dst.forEach((def,i)=>{if(def.free)return;const j=src.findIndex((d2,k)=>!used.has(k)&&!d2.free&&nm(d2)===nm(def));if(j<0)return;used.add(j);const r=cur.t.raw32[j]||{};cur.t[id][i]=Object.assign(cur.t[id][i]||{},{x:r.x||'',q:r.q||'',u:r.u||src[j].u||''})});
 const left=cur.t.raw32.map((d2,k)=>k).filter(k=>!used.has(k)&&(has((cur.t.raw32[k]||{}).q)||has((cur.t.raw32[k]||{}).n))),to=dst.map((d2,k)=>d2.free&&!has((cur.t[id][k]||{}).n)?k:-1).filter(k=>k>=0);

  const i=+el.dataset.i;if(selItem!==i){selItem=i;drawLaySel()}drag={i,mode:e.target.classList.contains('rz')?'rz':'mv',sx:e.clientX,sy:e.clientY,o:{...cur.layout[i]},r:L.getBoundingClientRect()};

function compress(file,M=1280,type='image/jpeg',q=.78){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,M/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);const g=cv.getContext('2d');if(type==='image/jpeg'){g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height)}g.drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL(type,q))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

function paginate(){let guard=0;
 for(let pi=0;pi<$$('#printRoot .pg').length&&guard<60;pi++){const pg=$$('#printRoot .pg')[pi];if(!pg.classList.contains('split'))continue;
  const pb=pg.querySelector('.pb'),fit=pb.firstElementChild;fit.style.transform='';fit.style.width='';

  const top=fit.getBoundingClientRect().top,kids=[...fit.children],bot=el=>el.getBoundingClientRect().bottom-top;
  let k=kids.findIndex(el=>bot(el)>H+1);if(k<0)continue;
  const np=pg.cloneNode(true),nfit=np.querySelector('.fit');nfit.innerHTML='';
  let carry=null;const el=kids[k],t0=el.tagName==='TABLE'?el:el.querySelector('table'),tbl=t0&&t0.classList.contains('grow')?t0:null;
  if(tbl){const rows=[...tbl.rows],body=rows.filter(r=>!r.querySelector('th')),j=body.findIndex(r=>bot(r)>H+1);
   if(j>1&&body.length-j>=1){const nt=tbl.cloneNode(false);[...tbl.children].filter(c=>c.tagName==='COLGROUP').forEach(c=>nt.appendChild(c.cloneNode(true)));
    rows.filter(r=>r.querySelector('th')).forEach(r=>nt.appendChild(r.cloneNode(true)));
    const rest=body.slice(j),mg=[...body[0].cells].filter(c=>c.classList.contains('mg')).map(c=>c.cellIndex);

    rest.forEach(r=>nt.appendChild(r));mg.sort((a,b)=>a-b).forEach(ci=>{const td=rest[0].insertCell(ci);td.className='top val';td.rowSpan=rest.length});
    if(el===tbl)carry=nt;else{carry=el.cloneNode(true);const t2=carry.querySelector('table');[...carry.children].forEach(ch=>{if(ch!==t2&&!ch.contains(t2))ch.remove()});t2.replaceWith(nt)}
    k++}}
  if(!carry)while(k>0&&!kids[k-1].querySelector('table')&&kids[k-1].tagName!=='TABLE'&&/(^|\s)(st|bl)(\s|$)/.test(kids[k-1].className))k--;
  if(k===0&&!carry)continue;

  kids.slice(k).forEach(c=>nfit.appendChild(c));
  pg.after(np)}

function printItem(d,it){
 if(it==='S31')return prS31(d);if(it[0]==='H'&&/^H3\./.test(it))return prHead(d,it.slice(1));
 if(it==='S4H')return SEC4H;if(it==='S41')return sec41(d);if(it==='S42')return sec42(d);if(it==='S43')return sec43(d);
 if(it==='S5')return sec5(d);if(it==='SIG')return sigBlock(d);if(it==='PHL')return photoList();
 const b=BLOCKS(d).find(x=>x.id===it);return b?prBlock(d,b):''}

function photoPages(d){const all=[];PH.forEach(p=>(d.photos[p.k]||[]).forEach(x=>all.push({...x,cat:p.n})));if(!all.length)return '';
 const pp=[];for(let i=0;i<all.length;i+=6)pp.push(all.slice(i,i+6));
 return pp.map((g,pi)=>`<section class="pg"><div class="phd"><b>ภาพประกอบการเก็บข้อมูล — ${esc(d.f.shop||'')}</b><span>วันที่สำรวจ ${thDate(d.f.date)}</span></div><div class="pgrid">${g.map((x,j)=>`<figure><div class="pim"><img src="${x.src}" alt=""></div><figcaption><b>ภาพที่ ${pi*6+j+1}</b> ${esc(x.cat)}${x.cap?' — '+esc(x.cap):''}</figcaption></figure>`).join('')}</div><div class="pf"><span>กองส่งเสริมและพัฒนาพลังงานภูมิภาค กระทรวงพลังงาน</span><span>ภาพประกอบ ${pi+1} / ${pp.length}</span></div></section>`).join('')}

function buildPrint(d){PDOC=d;let h='';if(S.pForm!==false)h+=[pg1,pg2,pg3,pg4].map(fn=>fn(d)).join('')+PTY(d).pages.map((items,i)=>page(5+i,items.map(it=>printItem(d,it)).join(''),1)).join('');if(S.pPhoto!==false)h+=photoPages(d);if(S.pCert!==false)h+=certPage(d);return h}
async function openPreview(){await flush();const h=buildPrint(cur);if(!h)return toast('ยังไม่ได้เลือกส่วนที่จะพิมพ์');
 $('#printRoot').innerHTML=`<div class="pvbar"><button class="btn" onclick="closePreview()">✕ ปิด</button><span>ตัวอย่างก่อนพิมพ์ · ${$$('.pg',(()=>{const t=document.createElement('div');t.innerHTML=h;return t})()).length} หน้า</span><button class="btn pri" onclick="doPrint()">🖨️ พิมพ์ / บันทึก PDF</button></div><div class="pages">${h}</div>`;
 document.body.classList.add('preview');paginate();autoFit();fitPages();window.scrollTo(0,0)}
function fitPages(){const w=window.innerWidth-16;$$('#printRoot .pg').forEach(p=>{p.style.zoom='';const pw=p.offsetWidth;p.style.zoom=pw>w?(w/pw).toFixed(3):''})}
function closePreview(){document.body.classList.remove('preview');$('#printRoot').innerHTML='';renderEditor()}
function doPrint(){const old=document.title;document.title=`แบบสำรวจ${PTY(cur).name}_${safe(cur.f.shop)}_${cur.f.date||''}`;$$('#printRoot .pg').forEach(p=>p.style.zoom='');autoFit();setTimeout(()=>{window.print();document.title=old;fitPages()},150)}
window.addEventListener('resize',()=>{if(document.body.classList.contains('preview'))fitPages()});
window.addEventListener('beforeprint',()=>$$('#printRoot .pg').forEach(p=>p.style.zoom=''));
window.addEventListener('afterprint',()=>{if(document.body.classList.contains('preview'))fitPages()});
